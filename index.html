<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily English Pro</title>
    
    <link rel="apple-touch-icon" href="https://i.imgur.com/8Q96z1l.png">
    <link rel="icon" type="image/png" href="https://i.imgur.com/8Q96z1l.png">

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --muted-color: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --danger-color: #dc2626;
            --success-color: #059669;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #090d16;
                --card-bg: #131d31;
                --text-color: #f8fafc;
                --accent-color: #38bdf8;
                --accent-hover: #0ea5e9;
                --muted-color: #94a3b8;
                --border-color: rgba(255, 255, 255, 0.08);
                --danger-color: #f87171;
                --success-color: #34d399;
            }
        }

        * {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        input, select {
            -webkit-user-select: text;
            user-select: text;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 750px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-card {
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            max-height: 680px;
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: -0.5px;
            color: var(--text-color);
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .btn-icon {
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid var(--border-color);
            color: var(--muted-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-icon:hover {
            background: rgba(128, 128, 128, 0.2);
            color: var(--text-color);
        }

        .view {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .view.active {
            display: flex;
        }

        .immersive-card {
            background: rgba(128, 128, 128, 0.04);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 24px 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin: 10px 0;
            position: relative;
        }

        .btn-copy {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid var(--border-color);
            color: var(--muted-color);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background: rgba(128, 128, 128, 0.2);
            color: var(--text-color);
        }

        .english-phrase {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-color);
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .audio-btn-large {
            background: var(--accent-color);
            border: none;
            color: #ffffff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 20px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .audio-btn-large:active {
            transform: scale(0.92);
        }

        .audio-btn-large:hover {
            background: var(--accent-hover);
        }

        .spanish-translation {
            font-size: 1.02rem;
            color: var(--muted-color);
            font-style: italic;
            max-width: 90%;
            line-height: 1.4;
        }

        .ai-generator-box {
            background: rgba(128, 128, 128, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ai-row {
            display: flex;
            gap: 8px;
        }

        .input-topic {
            flex-grow: 1;
            background: rgba(128, 128, 128, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .input-topic:focus, .select-level:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .select-level {
            background: rgba(128, 128, 128, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.85rem;
            width: 100%;
        }

        .btn-ai {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-ai:hover {
            background-color: var(--accent-hover);
        }

        .btn-ai:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .nav-controls {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-nav {
            background-color: rgba(128, 128, 128, 0.1);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
        }

        .btn-nav:hover:not(:disabled) {
            background-color: rgba(128, 128, 128, 0.2);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            flex: 2;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .config-input {
            width: 100%;
            background: rgba(128, 128, 128, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            padding: 10px 12px;
            font-family: inherit;
            font-size: 0.9rem;
            margin-bottom: 14px;
        }

        .config-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .instruction-text {
            font-size: 0.85rem;
            color: var(--muted-color);
            text-align: left;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .counter-badge {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
        }

        .toast {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            
            <!-- VISTA PRINCIPAL DE PRÁCTICA -->
            <div id="mainView" class="view active">
                <div class="header-row">
                    <h1>Daily English</h1>
                    <div class="header-actions">
                        <button class="btn-icon" onclick="limpiarBancoTotal()" title="Limpiar todo">🗑️</button>
                        <button class="btn-icon" onclick="cambiarVista('configView')" title="Configuración">⚙️</button>
                    </div>
                </div>

                <div class="counter-badge" id="counterBadge">Listo para empezar</div>

                <div class="immersive-card" id="phraseCard">
                    <!-- Contenido dinámico / Saludo aleatorio -->
                </div>

                <!-- Generador rápido por IA con Groq y Niveles -->
                <div class="ai-generator-box">
                    <div class="ai-row">
                        <input type="text" id="inputTopic" class="input-topic" placeholder="Ej: Comida, aeropuerto, oficina...">
                        <button class="btn-ai" id="btnGenerarIA" onclick="generarFrasesConGroq()">✨ Generar</button>
                    </div>
                    <select id="selectLevel" class="select-level">
                        <option value="Básico">Nivel: Básico</option>
                        <option value="Intermedio" selected>Nivel: Intermedio</option>
                        <option value="Avanzado">Nivel: Avanzado</option>
                    </select>
                </div>

                <div class="nav-controls" id="navControls">
                    <!-- Botones de navegación dinámicos -->
                </div>
            </div>

            <!-- VISTA DE CONFIGURACIÓN -->
            <div id="configView" class="view">
                <div class="header-row">
                    <h1>Configuración</h1>
                    <button class="btn-icon" onclick="cambiarVista('mainView')" title="Volver">✕</button>
                </div>

                <div class="instruction-text" style="margin-bottom: 6px;"><b>API Key de Groq:</b></div>
                <input type="password" id="inputApiKey" class="config-input" placeholder="gsk_...">

                <div class="instruction-text">
                    Configura tu clave secreta de Groq para que la IA genere de forma automática tus sesiones de práctica diarias con pronunciación y traducción en tiempo real.
                </div>

                <button class="btn-primary" onclick="guardarConfiguracion()" style="margin-top: 10px;">💾 Guardar Clave</button>
            </div>

            <div id="toast" class="toast">¡Copiado al portapapeles!</div>
        </div>
    </div>

    <script>
        let bancoFrases = [];
        let indiceActual = 0;

        const saludosAleatorios = [
            "¡Hola! ¿Qué te gustaría practicar hoy? 🚀",
            "Un nuevo día para mejorar tu inglés. Escribe un tema abajo ✨",
            "¿Listo para aprender algo nuevo? Ingresa una situación o tema 🎯",
            "Pequeños avances diarios crean grandes resultados. ¡Comenzamos! 💡"
        ];

        let ultimoToke = 0;
        document.addEventListener('touchend', function (event) {
            const ahora = new Date().getTime();
            if (ahora - ultimoToke <= 300) {
                event.preventDefault();
            }
            ultimoToke = ahora;
        }, { passive: false });

        window.onload = function() {
            const guardadas = localStorage.getItem('mi_banco_ingles');
            const apiKeyGuardada = localStorage.getItem('groq_api_key');
            
            if (apiKeyGuardada) {
                document.getElementById('inputApiKey').value = apiKeyGuardada;
            }

            if (guardadas) {
                bancoFrases = JSON.parse(guardadas);
            }
            
            if (bancoFrases.length === 0) {
                mostrarSaludoAleatorio();
            } else {
                indiceActual = 0;
                mostrarFraseActual();
            }
        };

        function cambiarVista(vistaId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(vistaId).classList.add('active');
        }

        function guardarConfiguracion() {
            const apiKey = document.getElementById('inputApiKey').value.trim();
            if (apiKey) {
                localStorage.setItem('groq_api_key', apiKey);
                alert("¡API Key guardada con éxito!");
                cambiarVista('mainView');
            } else {
                alert("Por favor ingresa una clave válida.");
            }
        }

        function mostrarSaludoAleatorio() {
            const card = document.getElementById('phraseCard');
            const navControls = document.getElementById('navControls');
            const counterBadge = document.getElementById('counterBadge');

            counterBadge.textContent = "Daily English Pro";
            const saludo = saludosAleatorios[Math.floor(Math.random() * saludosAleatorios.length)];

            card.innerHTML = `
                <div class="english-phrase" style="font-size: 1.25rem; color: var(--text-color);">${saludo}</div>
                <div class="spanish-translation" style="font-style: normal;">Escribe un tema abajo para crear tus frases con IA.</div>
            `;
            navControls.innerHTML = `<button class="btn-primary" onclick="document.getElementById('inputTopic').focus()">Escribe un tema...</button>`;
        }

        async function generarFrasesConGroq() {
            const tema = document.getElementById('inputTopic').value.trim();
            const nivel = document.getElementById('selectLevel').value;
            const apiKey = localStorage.getItem('groq_api_key') || document.getElementById('inputApiKey').value.trim();

            if (!apiKey) {
                alert("Por favor ingresa tu API Key de Groq en la configuración (⚙️).");
                cambiarVista('configView');
                return;
            }

            if (!tema) {
                alert("Por favor escribe un tema o situación (ej: Comida, Restaurante, Viajes).");
                return;
            }

            const btn = document.getElementById('btnGenerarIA');
            btn.disabled = true;
            btn.textContent = "Generando...";

            const promptText = `Genera exactamente 25 frases cotidianas y naturales en inglés sobre el tema: "${tema}", adaptadas a un nivel ${nivel}. 
Devuélvelas estrictamente en formato de texto plano, una por línea, separando el inglés y su traducción al español con una barra vertical (|). 
No incluyas numeración, ni viñetas, ni texto adicional, solo las líneas con el formato: Frase en inglés | Traducción al español.`;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: promptText }],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    throw new Error("Error en la conexión con la API de Groq. Verifica tu clave.");
                }

                const data = await response.json();
                const contenido = data.choices[0].message.content;
                const lineas = contenido.split('\n');
                let nuevasFrases = [];

                for (let linea of lineas) {
                    if (linea.includes('|')) {
                        const partes = linea.split('|');
                        const en = partes[0].replace(/^[0-9\.\-\)\s]+/, '').trim();
                        const es = partes[1].trim();
                        if (en && es) {
                            nuevasFrases.push({ en, es });
                        }
                    }
                }

                if (nuevasFrases.length === 0) {
                    throw new Error("No se pudieron parsear las frases devueltas por la IA.");
                }

                bancoFrases = nuevasFrases;
                localStorage.setItem('mi_banco_ingles', JSON.stringify(bancoFrases));
                indiceActual = 0;
                document.getElementById('inputTopic').value = '';
                mostrarFraseActual();

            } catch (error) {
                alert(error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "✨ Generar";
            }
        }

        function mostrarFraseActual() {
            const card = document.getElementById('phraseCard');
            const navControls = document.getElementById('navControls');
            const counterBadge = document.getElementById('counterBadge');

            if (bancoFrases.length === 0) {
                mostrarSaludoAleatorio();
                return;
            }

            if (indiceActual >= bancoFrases.length) {
                counterBadge.textContent = "¡Ciclo completado!";
                card.innerHTML = `
                    <div class="english-phrase" style="color: var(--success-color); font-size: 1.3rem;">¡Excelente trabajo! 🚀</div>
                    <div class="spanish-translation" style="font-style: normal; margin-bottom: 10px;">Has repasado ordenadamente todas las frases de tu sesión.</div>
                `;
                navControls.innerHTML = `
                    <button class="btn-nav" onclick="reiniciarCiclo()">🔄 Repetir</button>
                    <button class="btn-primary" onclick="document.getElementById('inputTopic').focus()">Nuevo Tema</button>
                `;
                return;
            }

            counterBadge.textContent = `Frase ${indiceActual + 1} de ${bancoFrases.length}`;
            const frase = bancoFrases[indiceActual];
            const textoSeguro = frase.en.replace(/'/g, "\\'");

            card.innerHTML = `
                <button class="btn-copy" onclick="copiarFraseActual()" title="Copiar frase">📋</button>
                <div class="english-phrase">"${frase.en}"</div>
                <button class="audio-btn-large" onclick="reproducirAudio('${textoSeguro}')" title="Escuchar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                </button>
                <div class="spanish-translation">${frase.es}</div>
            `;

            navControls.innerHTML = `
                <button class="btn-nav" onclick="fraseAnterior()" ${indiceActual === 0 ? 'disabled' : ''}>⬅️ Anterior</button>
                <button class="btn-primary" onclick="fraseSiguiente()">Siguiente ➡️</button>
            `;
        }

        function fraseSiguiente() {
            if (indiceActual < bancoFrases.length) {
                indiceActual++;
                mostrarFraseActual();
            }
        }

        function fraseAnterior() {
            if (indiceActual > 0) {
                indiceActual--;
                mostrarFraseActual();
            }
        }

        function reiniciarCiclo() {
            indiceActual = 0;
            mostrarFraseActual();
        }

        function limpiarBancoTotal() {
            if (confirm("¿Estás seguro de vaciar el banco actual?")) {
                bancoFrases = [];
                localStorage.removeItem('mi_banco_ingles');
                indiceActual = 0;
                mostrarSaludoAleatorio();
            }
        }

        function reproducirAudio(texto) {
            if (!texto) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function copiarFraseActual() {
            if (bancoFrases.length === 0 || indiceActual >= bancoFrases.length) return;
            const frase = bancoFrases[indiceActual];
            const textoACopiar = `${frase.en} - ${frase.es}`;
            
            navigator.clipboard.writeText(textoACopiar).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 1500);
            });
        }
    </script>
</body>
</html>
