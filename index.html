<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paul</title>
    
    <!-- Configuración para Iconos y Pantalla de Inicio (iOS y Android) -->
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paul">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería Marked.js para formato Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <meta name="theme-color" content="#131314" id="theme-color-meta">
    <style>
        :root {
            --bg-main: #f8f9fa;
            --bg-header: #f8f9fa;
            --border-color: #dadce0;
            --text-main: #1f1f1f;
            --text-secondary: #5f6368;
            --bubble-ai: #f0f4f9;
            --bubble-ai-border: #d3e3fd;
            --bubble-user: #0b57d0;
            --bubble-user-text: #ffffff;
            --input-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #131314;
                --bg-header: #131314;
                --border-color: #3c4043;
                --text-main: #e3e3e3;
                --text-secondary: #9aa0a6;
                --bubble-ai: #1e1f20;
                --bubble-ai-border: #3c4043;
                --bubble-user: #004a77;
                --bubble-user-text: #ffffff;
                --input-bg: #1e1f20;
            }
        }

        /* Bloquear zoom por gestos, pellizcos y desplazamiento elástico en móviles */
        html, body {
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .gemini-header {
            background-color: var(--bg-header);
            border-color: var(--border-color);
        }

        .gemini-bubble-ai {
            background-color: var(--bubble-ai);
            border: 1px solid var(--bubble-ai-border);
            color: var(--text-main);
        }

        .gemini-bubble-user {
            background-color: var(--bubble-user);
            color: var(--bubble-user-text);
        }

        .gemini-input-container {
            background-color: var(--input-bg);
            border-color: var(--border-color);
        }

        /* Estilos Markdown y adaptación estricta a pantallas móviles */
        .markdown-content {
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
        }
        .markdown-content p { margin-bottom: 0.75rem; }
        .markdown-content p:last-child { margin-bottom: 0; }
        .markdown-content ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-content ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-content li { margin-bottom: 0.25rem; }
        .markdown-content strong { font-weight: 600; }
        .markdown-content code { background: rgba(0,0,0,0.06); padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 85%; word-break: break-all; }
        
        .markdown-content table {
            width: 100%;
            display: block;
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 0.75rem;
            border-collapse: collapse;
        }
        .markdown-content th, .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            font-size: 0.85rem;
        }

        @media (prefers-color-scheme: dark) {
            .markdown-content code { background: rgba(255,255,255,0.1); }
        }

        /* Animación de puntos rebotando */
        @keyframes bounce-custom {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
        .typing-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: currentColor;
            border-radius: 50%;
            animation: bounce-custom 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col justify-between h-full w-full">

    <!-- Panel Lateral de Historial (Drawer estilo Gemini) -->
    <div id="history-drawer" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden transition-opacity duration-300 flex justify-start">
        <div class="w-80 h-full gemini-header border-r flex flex-col p-4 shadow-2xl transition-transform duration-300">
            <div class="flex items-center justify-between pb-4 border-b border-[var(--border-color)]">
                <h2 class="font-medium text-base">Historial de Chats</h2>
                <button onclick="toggleHistoryDrawer()" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <button onclick="startNewChat()" class="mt-4 w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white rounded-full font-medium text-sm transition shadow flex items-center justify-center gap-2">
                <span>+ Nuevo chat</span>
            </button>

            <div id="history-list" class="flex-1 overflow-y-auto mt-4 space-y-2"></div>
        </div>
        <div class="flex-1" onclick="toggleHistoryDrawer()"></div>
    </div>

    <!-- Cabecera exacta a la interfaz de Gemini -->
    <header class="gemini-header flex items-center justify-between px-4 py-3 border-b select-none z-10 transition-colors duration-300 flex-shrink-0">
        <!-- Izquierda: Menú / Historial -->
        <div class="flex items-center gap-3">
            <button onclick="toggleHistoryDrawer()" class="w-10 h-10 rounded-full border border-[var(--border-color)] flex items-center justify-center text-[var(--text-main)] hover:bg-black/5 dark:hover:bg-white/5 transition flex-shrink-0" title="Historial">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            
            <!-- Selector central idéntico a Gemini -->
            <div class="flex items-center gap-1.5 cursor-pointer py-1 px-2.5 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition" onclick="configureKeys()">
                <span class="text-base font-semibold tracking-wide">Paul</span>
                <span class="text-sm text-[var(--text-secondary)] font-normal">Flash</span>
                <svg class="w-4 h-4 text-[var(--text-secondary)]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </div>

        <!-- Derecha: Botón de edición de nuevo chat y perfil -->
        <div class="flex items-center gap-2 flex-shrink-0">
            <button id="keys-btn" onclick="configureKeys()" class="text-[var(--text-secondary)] hover:text-[var(--text-main)] p-2 rounded-full transition text-xs flex items-center gap-1 border border-[var(--border-color)] px-3 py-1 rounded-full hidden" title="Configurar API Key">
                🔑 Llave
            </button>
            <button onclick="startNewChat()" class="w-10 h-10 rounded-full border border-[var(--border-color)] flex items-center justify-center text-[var(--text-main)] hover:bg-black/5 dark:hover:bg-white/5 transition flex-shrink-0" title="Nuevo chat">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </button>
            <img src="logo.jpg" alt="Perfil" class="w-10 h-10 rounded-full object-cover shadow-sm border border-[var(--border-color)] cursor-pointer flex-shrink-0" onclick="configureKeys()" title="Configurar API Key">
        </div>
    </header>

    <!-- Contenedor del Chat (Ajustado para evitar desbordamientos) -->
    <main id="chat-container" class="flex-1 overflow-y-auto overflow-x-hidden px-4 py-6 space-y-6 max-w-3xl w-full mx-auto"></main>

    <!-- Barra Inferior de Entrada (Estilo exacto de la Foto 1 de Gemini) -->
    <footer class="p-3 gemini-header flex flex-col items-center transition-colors duration-300 relative flex-shrink-0 pb-6">
        <form id="chat-form" class="gemini-input-container w-full max-w-3xl border rounded-full px-4 py-2.5 flex items-center gap-3 focus-within:border-blue-500 transition shadow-lg">
            
            <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.txt,.doc,.docx">
            <button type="button" onclick="document.getElementById('file-input').click()" class="text-[var(--text-secondary)] hover:text-[var(--text-main)] transition flex items-center justify-center flex-shrink-0" title="Adjuntar archivo o foto">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            </button>

            <input 
                type="text" 
                id="user-input" 
                placeholder="Pregúntale a Paul..." 
                autocomplete="off"
                class="flex-1 bg-transparent text-[var(--text-main)] placeholder-[var(--text-secondary)] text-sm focus:outline-none py-1.5 px-1 min-w-0"
            >

            <button 
                type="submit" 
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-full transition flex items-center justify-center shadow flex-shrink-0"
            >
                <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0l-7 7m7-7l7 7"></path></svg>
            </button>
        </form>
        <div id="file-indicator" class="text-[11px] text-blue-500 mt-1.5 hidden font-medium">📎 Archivo adjunto listo</div>
    </footer>

    <!-- Script de Gestión -->
    <script>
        const chatContainer = document.getElementById("chat-container");
        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const keysBtn = document.getElementById("keys-btn");
        const fileInput = document.getElementById("file-input");
        const fileIndicator = document.getElementById("file-indicator");
        const historyDrawer = document.getElementById("history-drawer");
        const historyList = document.getElementById("history-list");

        const selectedModel = "openai/gpt-oss-120b";
        let attachedFile = null;

        let chatHistory = JSON.parse(localStorage.getItem('paul_chat_history')) || [];
        let sessions = JSON.parse(localStorage.getItem('paul_sessions')) || [];

        checkKeysState();
        renderStoredHistory();
        updateHistoryDrawerList();

        function checkKeysState() {
            const groqKey = localStorage.getItem('paul_groq_key');
            if (!groqKey || groqKey.trim() === '') {
                keysBtn.classList.remove('hidden');
            } else {
                keysBtn.classList.add('hidden');
            }
        }

        const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        function updateThemeColor(e) {
            document.getElementById('theme-color-meta').setAttribute('content', e.matches ? '#131314' : '#f8f9fa');
        }
        darkModeMediaQuery.addEventListener('change', updateThemeColor);
        updateThemeColor(darkModeMediaQuery);

        document.addEventListener('gesturestart', (e) => e.preventDefault());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                attachedFile = e.target.files[0];
                fileIndicator.innerText = `📎 Adjunto: ${attachedFile.name}`;
                fileIndicator.classList.remove('hidden');
            }
        });

        function configureKeys() {
            const currentKey = localStorage.getItem('paul_groq_key') || '';
            const groqKey = prompt("Ingresa tu API Key de Groq (empieza con gsk_):", currentKey);
            if (groqKey !== null) {
                const cleanKey = groqKey.trim();
                if (cleanKey === '') {
                    localStorage.removeItem('paul_groq_key');
                    checkKeysState();
                    alert("Se ha borrado la llave guardada.");
                    return;
                }
                if (!cleanKey.startsWith('gsk_')) {
                    alert("⚠️ Una clave de Groq válida debe empezar con 'gsk_'. Por favor verifica tu llave.");
                    return;
                }
                localStorage.setItem('paul_groq_key', cleanKey);
                checkKeysState();
                alert("¡Llave de Groq guardada correctamente!");
            }
        }

        function toggleHistoryDrawer() {
            historyDrawer.classList.toggle('hidden');
            updateHistoryDrawerList();
        }

        function updateHistoryDrawerList() {
            historyList.innerHTML = '';
            
            if (chatHistory.length > 0) {
                const currentSessionBtn = document.createElement('div');
                currentSessionBtn.className = "p-3 rounded-xl bg-black/5 dark:bg-white/5 cursor-pointer text-sm font-medium truncate flex items-center justify-between";
                const firstUserMsg = chatHistory.find(m => m.role === 'user');
                currentSessionBtn.innerHTML = `<span>💬 ${firstUserMsg ? firstUserMsg.content.substring(0, 25) + '...' : 'Chat actual'}</span> <span class="text-xs text-blue-500">Activo</span>`;
                historyList.appendChild(currentSessionBtn);
            }

            if (sessions.length === 0 && chatHistory.length === 0) {
                historyList.innerHTML = `<p class="text-xs text-[var(--text-secondary)] text-center py-4">No hay chats guardados</p>`;
                return;
            }

            sessions.forEach((session, idx) => {
                const item = document.createElement('div');
                item.className = "p-3 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer text-sm truncate flex items-center justify-between text-[var(--text-secondary)] hover:text-[var(--text-main)] transition";
                item.innerHTML = `<span>🗨️ ${session.title || 'Conversación anterior'}</span>`;
                item.onclick = () => loadSession(idx);
                historyList.appendChild(item);
            });
        }

        function startNewChat() {
            if (chatHistory.length > 0) {
                const firstMsg = chatHistory.find(m => m.role === 'user');
                const title = firstMsg ? firstMsg.content.substring(0, 25) + '...' : 'Chat anterior';
                sessions.unshift({ title, history: [...chatHistory] });
                localStorage.setItem('paul_sessions', JSON.stringify(sessions));
            }

            localStorage.removeItem('paul_chat_history');
            chatHistory = [];
            chatContainer.innerHTML = '';
            appendMessage('bot', '¡Hola! Soy Paul, ¿qué puedo hacer por ti?', null, false, null);
            toggleHistoryDrawer();
        }

        function loadSession(idx) {
            const session = sessions[idx];
            if (session) {
                if (chatHistory.length > 0) {
                    const firstMsg = chatHistory.find(m => m.role === 'user');
                    const title = firstMsg ? firstMsg.content.substring(0, 25) + '...' : 'Chat anterior';
                    sessions.unshift({ title, history: [...chatHistory] });
                }
                chatHistory = [...session.history];
                sessions.splice(idx, 1);
                localStorage.setItem('paul_sessions', JSON.stringify(sessions));
                localStorage.setItem('paul_chat_history', JSON.stringify(chatHistory));
                renderStoredHistory();
                toggleHistoryDrawer();
            }
        }

        function renderStoredHistory() {
            chatContainer.innerHTML = '';
            if (chatHistory.length === 0) {
                appendMessage('bot', '¡Hola! Soy Paul, ¿qué puedo hacer por ti?', null, false, null);
            } else {
                chatHistory.forEach((msg, index) => {
                    appendMessage(msg.role, msg.content, null, false, index);
                });
            }
        }

        function appendMessage(sender, text, fileObj = null, isTyping = false, historyIndex = null) {
            const isUser = sender === 'user' || sender === 'system';
            if (sender === 'system') return;

            const row = document.createElement('div');
            row.className = `flex items-start gap-3 w-full max-w-full ${isUser ? 'justify-end' : 'justify-start'}`;
            
            if (!isUser) {
                const avatar = document.createElement('img');
                avatar.src = "logo.jpg";
                avatar.className = "w-8 h-8 rounded-full object-cover flex-shrink-0 shadow border border-[var(--border-color)]";
                row.appendChild(avatar);
            }

            const bubbleContainer = document.createElement('div');
            bubbleContainer.className = `max-w-[85%] sm:max-w-[75%] flex flex-col ${isUser ? 'items-end' : 'items-start'} gap-1.5 min-w-0`;

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl px-5 py-4 text-sm leading-relaxed shadow-sm markdown-content w-full overflow-hidden ${
                isUser ? 'gemini-bubble-user rounded-br-sm' : 'gemini-bubble-ai rounded-bl-sm'
            }`;

            if (fileObj) {
                if (fileObj.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(fileObj);
                    img.className = "max-w-xs rounded-lg mb-2 shadow";
                    bubble.appendChild(img);
                } else {
                    const fileTag = document.createElement('div');
                    fileTag.className = "text-xs opacity-80 mb-1 font-semibold";
                    fileTag.innerText = `📄 Archivo: ${fileObj.name}`;
                    bubble.appendChild(fileTag);
                }
            }

            const textNode = document.createElement('div');
            textNode.className = "w-full overflow-x-auto";
            
            if (isTyping) {
                textNode.innerHTML = `<span class="typing-dot"></span> <span class="typing-dot"></span> <span class="typing-dot"></span>`;
            } else {
                textNode.innerHTML = marked.parse(text);
            }
            
            bubble.appendChild(textNode);
            bubbleContainer.appendChild(bubble);

            if (!isTyping) {
                const actionsBar = document.createElement('div');
                actionsBar.className = "flex items-center gap-3 text-[var(--text-secondary)] px-1";

                if (isUser && historyIndex !== null) {
                    const editBtn = document.createElement('button');
                    editBtn.className = "hover:text-[var(--text-main)] transition p-1";
                    editBtn.title = "Editar mensaje";
                    editBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>`;
                    editBtn.onclick = () => editMessage(historyIndex);
                    actionsBar.appendChild(editBtn);
                } else if (!isUser) {
                    const retryBtn = document.createElement('button');
                    retryBtn.className = "hover:text-[var(--text-main)] transition p-1";
                    retryBtn.title = "Reintentar respuesta";
                    retryBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>`;
                    retryBtn.onclick = () => {
                        if (historyIndex !== null && historyIndex > 0) {
                            editMessage(historyIndex - 1);
                        }
                    };
                    actionsBar.appendChild(retryBtn);

                    const copyBtn = document.createElement('button');
                    copyBtn.className = "hover:text-[var(--text-main)] transition p-1";
                    copyBtn.title = "Copiar texto";
                    copyBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>`;
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(text);
                        copyBtn.innerHTML = `<svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
                        setTimeout(() => {
                            copyBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>`;
                        }, 2000);
                    };
                    actionsBar.appendChild(copyBtn);
                }
                bubbleContainer.appendChild(actionsBar);
            }
            
            row.appendChild(bubbleContainer);
            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        async function editMessage(index) {
            const oldMsg = chatHistory[index];
            if (!oldMsg || oldMsg.role !== 'user') return;

            const newText = prompt("Edita tu mensaje:", oldMsg.content);
            if (newText === null || newText.trim() === '') return;

            chatHistory = chatHistory.slice(0, index);
            localStorage.setItem('paul_chat_history', JSON.stringify(chatHistory));
            renderStoredHistory();

            await processAndSend(newText.trim(), null);
        }

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            const fileToSend = attachedFile;

            if (!text && !fileToSend) return;

            userInput.value = "";
            attachedFile = null;
            fileIndicator.classList.add('hidden');
            fileInput.value = "";

            let messageText = text;
            if (fileToSend) {
                messageText += ` [Archivo adjunto: ${fileToSend.name}]`;
            }

            await processAndSend(messageText, fileToSend);
        });

        async function processAndSend(messageText, fileToSend) {
            chatHistory.push({ role: "user", content: messageText });
            localStorage.setItem('paul_chat_history', JSON.stringify(chatHistory));

            renderStoredHistory();

            const botBubbleContainer = appendMessage('bot', '', null, true);
            const textContainer = botBubbleContainer.querySelector('div');

            try {
                const apiKey = localStorage.getItem('paul_groq_key');
                if (!apiKey) {
                    throw new Error("Falta configurar tu API Key de Groq. Haz clic en el logo superior para ingresarla.");
                }

                const apiMessages = [
                    { role: "system", content: "Eres Paul, un asistente personal útil, directo, amigable y bien estructurado." },
                    ...chatHistory.map(m => ({ role: m.role, content: m.content }))
                ];

                const url = "https://api.groq.com/openai/v1/chat/completions";
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: apiMessages,
                        stream: true
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "Error en la red");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullResponse = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith("data: ")) {
                            const jsonStr = trimmed.replace("data: ", "");
                            if (jsonStr === "[DONE]") continue;

                            try {
                                const parsed = JSON.parse(jsonStr);
                                const content = parsed.choices[0]?.delta?.content || "";
                                if (content) {
                                    fullResponse += content;
                                    textContainer.innerHTML = marked.parse(fullResponse);
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }

                chatHistory.push({ role: "assistant", content: fullResponse });
                localStorage.setItem('paul_chat_history', JSON.stringify(chatHistory));
                renderStoredHistory();

            } catch (err) {
                console.error(err);
                textContainer.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
