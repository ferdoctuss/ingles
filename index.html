<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily English AI Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --muted-color: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* Selector de Niveles */
        .levels-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 22px;
        }

        .level-btn {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--muted-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .level-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        /* Botones de Categorías */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .cat-btn {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-btn:hover {
            background-color: rgba(56, 189, 248, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .cat-btn.active {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Caja de Resultado */
        .phrase-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 25px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .english-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .english-phrase {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.15);
            border: none;
            color: var(--accent-color);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            flex-shrink: 0;
        }

        .audio-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
        }

        .audio-btn:active {
            transform: scale(0.9);
        }

        .spanish-translation {
            font-size: 1rem;
            color: var(--muted-color);
            margin-bottom: 12px;
        }

        .example-usage {
            font-size: 0.85rem;
            font-style: italic;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-color);
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Daily English AI</h1>
            
            <!-- Selector de Niveles -->
            <div class="levels-container">
                <button class="level-btn active" onclick="seleccionarNivel('BASIC', this)">BASIC</button>
                <button class="level-btn" onclick="seleccionarNivel('INTERMEDIATE', this)">INTERMEDIATE</button>
                <button class="level-btn" onclick="seleccionarNivel('ADVANCED', this)">ADVANCED</button>
            </div>

            <!-- Botones de Categorías -->
            <div class="categories-grid">
                <button class="cat-btn" onclick="generarFrase('Vida cotidiana', this)">☕ Vida cotidiana</button>
                <button class="cat-btn" onclick="generarFrase('Pasatiempos', this)">🎮 Pasatiempos</button>
                <button class="cat-btn" onclick="generarFrase('Hablar con pareja', this)">❤️ Hablar con pareja</button>
                <button class="cat-btn" onclick="generarFrase('Hablar con hijo', this)">🧸 Hablar con hijo</button>
            </div>

            <!-- Caja de Visualización -->
            <div class="phrase-box" id="phraseContainer">
                <div class="english-phrase" style="font-size: 1.1rem; color: var(--muted-color);">Selecciona una categoría arriba para empezar a aprender 🚀</div>
                <div class="spanish-translation"></div>
                <div class="example-usage" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'AQ.Ab8RN6J--BLPPlrCYWjtiu3vDJOUjfmY_HSksu69KdkRQ8v-eQ'; 
        
        let nivelActual = 'BASIC';
        let fraseActualTexto = '';

        function seleccionarNivel(nivel, elemento) {
            nivelActual = nivel;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
        }

        async function generarFrase(categoria, elemento) {
            const container = document.getElementById('phraseContainer');
            
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');

            container.innerHTML = `
                <div class="english-phrase">Generando frase... 🤖</div>
                <div class="spanish-translation">Creando contenido nivel ${nivelActual}...</div>
                <div class="example-usage" style="display:none;"></div>
            `;

            const promptText = `Actúa como un profesor experto de inglés. Genera una frase o expresión útil enfocada en la categoría "${categoria}" adecuada estrictamente para un nivel "${nivelActual}". 
            Responde estrictamente usando un formato JSON con tres llaves exactas: 
            'en' (la frase en inglés), 
            'es' (la traducción al español), y 
            'ex' (un ejemplo corto de uso con su respectiva traducción). 
            No agregues markdown ni texto adicional fuera del JSON.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || "Error devuelto por la API");
                }

                if (data.candidates && data.candidates[0].content) {
                    let textoRespuesta = data.candidates[0].content.parts[0].text;
                    textoRespuesta = textoRespuesta.replace(/```json/g, '').replace(/```/g, '').trim();
                    const resultado = JSON.parse(textoRespuesta);

                    fraseActualTexto = resultado.en;

                    container.innerHTML = `
                        <div class="english-wrapper">
                            <div class="english-phrase">"${resultado.en}"</div>
                            <button class="audio-btn" onclick="reproducirAudio()" title="Escuchar pronunciación">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                            </button>
                        </div>
                        <div class="spanish-translation">${resultado.es}</div>
                        <div class="example-usage">${resultado.ex}</div>
                    `;
                } else {
                    throw new Error("Estructura de respuesta inesperada.");
                }

            } catch (error) {
                console.error("Detalle del error:", error);
                container.innerHTML = `
                    <div class="english-phrase" style="color: #f87171; font-size: 1rem;">Ocurrió un error</div>
                    <div class="spanish-translation" style="font-size: 0.85rem;">No se pudo conectar con la IA. Revisa tu conexión.</div>
                    <div class="example-usage" style="display:none;"></div>
                `;
            }
        }

        function reproducirAudio() {
            if (!fraseActualTexto) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(fraseActualTexto);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
