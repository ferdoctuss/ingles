<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily English AI Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --muted-color: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --warning-color: #fbbf24;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* Cabecera y botón discreto */
        .header-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .btn-discreto {
            position: absolute;
            right: 0;
            background: transparent;
            border: none;
            color: var(--muted-color);
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, transform 0.2s;
        }

        .btn-discreto:hover {
            opacity: 1;
            transform: rotate(45deg);
        }

        /* Botón Agregar API */
        .api-btn {
            background-color: rgba(251, 191, 36, 0.1);
            color: var(--warning-color);
            border: 1px solid var(--warning-color);
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.2s;
        }

        .api-btn:hover {
            background-color: rgba(251, 191, 36, 0.2);
        }

        /* Selector de Niveles */
        .levels-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 22px;
        }

        .level-btn {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--muted-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .level-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        /* Botones de Categorías */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .cat-btn {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-btn:hover {
            background-color: rgba(56, 189, 248, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .cat-btn.active {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Caja de Resultado */
        .phrase-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        .english-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .english-phrase {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.15);
            border: none;
            color: var(--accent-color);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            flex-shrink: 0;
        }

        .audio-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
        }

        .audio-btn:active {
            transform: scale(0.9);
        }

        .spanish-translation {
            font-size: 1rem;
            color: var(--muted-color);
            margin-bottom: 12px;
        }

        .example-usage {
            font-size: 0.85rem;
            font-style: italic;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-color);
            text-align: left;
        }

        /* Botón Recargar Frase */
        .btn-reload-phrase {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            display: none; /* Oculto por defecto hasta generar una frase */
        }

        .btn-reload-phrase:hover {
            background-color: var(--accent-hover);
        }

        .btn-reload-phrase:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            
            <div class="header-row">
                <h1>Daily English AI</h1>
                <!-- Botón discreto para recargar la web -->
                <button class="btn-discreto" onclick="location.reload()" title="Recargar Web">↻</button>
            </div>

            <!-- Botón para agregar API (desaparece al tenerla) -->
            <button id="btn-add-api" class="api-btn" onclick="solicitarApiKey()">🔑 Agregar API</button>
            
            <!-- Selector de Niveles -->
            <div class="levels-container">
                <button class="level-btn active" onclick="seleccionarNivel('BASIC', this)">BASIC</button>
                <button class="level-btn" onclick="seleccionarNivel('INTERMEDIATE', this)">INTERMEDIATE</button>
                <button class="level-btn" onclick="seleccionarNivel('ADVANCED', this)">ADVANCED</button>
            </div>

            <!-- Botones de Categorías -->
            <div class="categories-grid">
                <button class="cat-btn" onclick="prepararFrase('Vida cotidiana', this)">☕ Vida cotidiana</button>
                <button class="cat-btn" onclick="prepararFrase('Pasatiempos', this)">🎮 Pasatiempos</button>
                <button class="cat-btn" onclick="prepararFrase('Hablar con pareja', this)">❤️ Hablar con pareja</button>
                <button class="cat-btn" onclick="prepararFrase('Hablar con hijo', this)">🧸 Hablar con hijo</button>
            </div>

            <!-- Caja de Visualización -->
            <div class="phrase-box" id="phraseContainer">
                <div class="english-phrase" style="font-size: 1.1rem; color: var(--muted-color);">Selecciona una categoría arriba para empezar a aprender 🚀</div>
                <div class="spanish-translation"></div>
                <div class="example-usage" style="display:none;"></div>
            </div>

            <!-- Botón para recargar una nueva frase del mismo tema -->
            <button id="btn-reload-phrase" class="btn-reload-phrase" onclick="recargarFraseActual()">🔄 Recargar nueva frase</button>

        </div>
    </div>

    <script>
        let nivelActual = 'BASIC';
        let categoriaActiva = null;
        let elementoCategoriaActivo = null;
        let fraseActualTexto = '';

        // Función para revisar si ya hay API y ocultar el botón
        function verificarInterfazApi() {
            const apiBtn = document.getElementById('btn-add-api');
            if (localStorage.getItem('gemini_api_key')) {
                apiBtn.style.display = 'none';
            } else {
                apiBtn.style.display = 'inline-block';
            }
        }

        // Ejecutar revisión de interfaz apenas carga la web
        verificarInterfazApi();

        // Función para pedir la API Key al hacer clic en "Agregar API"
        function solicitarApiKey() {
            const nuevaKey = prompt("Pega aquí tu API Key de Google AI Studio:");
            if (nuevaKey && nuevaKey.trim() !== '') {
                localStorage.setItem('gemini_api_key', nuevaKey.trim());
                verificarInterfazApi();
                alert("¡API Key guardada con éxito!");
            }
        }

        function seleccionarNivel(nivel, elemento) {
            nivelActual = nivel;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
        }

        // Prepara los datos antes de llamar a la IA
        function prepararFrase(categoria, elemento) {
            categoriaActiva = categoria;
            elementoCategoriaActivo = elemento;
            
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');

            // Mostrar el botón de recargar frase
            document.getElementById('btn-reload-phrase').style.display = 'block';

            generarFrase();
        }

        // Dispara la IA con la misma categoría seleccionada previamente
        function recargarFraseActual() {
            if (categoriaActiva) {
                generarFrase();
            }
        }

        async function generarFrase() {
            let API_KEY = localStorage.getItem('gemini_api_key');

            if (!API_KEY) {
                alert("Primero debes agregar tu API Key pulsando el botón amarillo '🔑 Agregar API'.");
                return;
            }

            const container = document.getElementById('phraseContainer');
            const btnReload = document.getElementById('btn-reload-phrase');

            container.innerHTML = `
                <div class="english-phrase">Generando frase... 🤖</div>
                <div class="spanish-translation">Creando contenido nivel ${nivelActual}...</div>
                <div class="example-usage" style="display:none;"></div>
            `;
            
            btnReload.disabled = true;
            btnReload.innerText = "Cargando...";

            const promptText = `Actúa como un profesor experto de inglés. Genera una frase o expresión útil enfocada en la categoría "${categoriaActiva}" adecuada estrictamente para un nivel "${nivelActual}". 
            Responde estrictamente usando un formato JSON con tres llaves exactas: 
            'en' (la frase en inglés), 
            'es' (la traducción al español), y 
            'ex' (un ejemplo corto de uso con su respectiva traducción). 
            No agregues markdown ni texto adicional fuera del JSON.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    if (data.error.code === 400 || data.error.code === 403) {
                        localStorage.removeItem('gemini_api_key');
                        verificarInterfazApi();
                        throw new Error("Clave bloqueada o inválida.");
                    }
                    throw new Error(data.error.message);
                }

                if (data.candidates && data.candidates[0].content) {
                    let textoRespuesta = data.candidates[0].content.parts[0].text;
                    textoRespuesta = textoRespuesta.replace(/```json/g, '').replace(/```/g, '').trim();
                    const resultado = JSON.parse(textoRespuesta);

                    fraseActualTexto = resultado.en;

                    container.innerHTML = `
                        <div class="english-wrapper">
                            <div class="english-phrase">"${resultado.en}"</div>
                            <button class="audio-btn" onclick="reproducirAudio()" title="Escuchar pronunciación">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                            </button>
                        </div>
                        <div class="spanish-translation">${resultado.es}</div>
                        <div class="example-usage">${resultado.ex}</div>
                    `;
                } else {
                    throw new Error("Respuesta inesperada de la IA.");
                }

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="english-phrase" style="color: #f87171; font-size: 1rem;">Ocurrió un error</div>
                    <div class="spanish-translation" style="font-size: 0.85rem;">${error.message === "Clave bloqueada o inválida." ? "Tu clave es inválida. Agrégala de nuevo." : "Fallo de conexión."}</div>
                    <div class="example-usage" style="display:none;"></div>
                `;
            } finally {
                btnReload.disabled = false;
                btnReload.innerText = "🔄 Recargar nueva frase";
            }
        }

        function reproducirAudio() {
            if (!fraseActualTexto) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(fraseActualTexto);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
