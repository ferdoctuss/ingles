<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily English Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --muted-color: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger-color: #f87171;
            --success-color: #34d399;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            letter-spacing: -0.5px;
            color: var(--accent-color);
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--muted-color);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s, transform 0.2s;
        }

        .btn-icon:hover {
            color: var(--text-color);
            transform: scale(1.1);
        }

        /* Vistas (Principal y Configuración) */
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        /* Estilo de la Frase */
        .phrase-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px;
            box-sizing: border-box;
        }

        .english-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .english-phrase {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.4;
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.15);
            border: none;
            color: var(--accent-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .audio-btn:hover {
            background: var(--accent-color);
            color: #0f172a;
        }

        .spanish-translation {
            font-size: 0.95rem;
            color: var(--muted-color);
            font-style: italic;
        }

        /* Botones principales de acción */
        .btn-primary {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: rgba(248, 113, 113, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-danger:hover {
            background-color: rgba(248, 113, 113, 0.25);
        }

        /* Pantalla de Configuración / Carga */
        textarea {
            width: 100%;
            height: 180px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            padding: 12px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 15px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .instruction-text {
            font-size: 0.82rem;
            color: var(--muted-color);
            text-align: left;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .counter-badge {
            font-size: 0.8rem;
            color: var(--muted-color);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            
            <!-- VISTA PRINCIPAL DE PRÁCTICA -->
            <div id="mainView" class="view active">
                <div class="header-row">
                    <h1>Daily English</h1>
                    <button class="btn-icon" onclick="cambiarVista('configView')" title="Configuración">⚙️</button>
                </div>

                <div class="counter-badge" id="counterBadge">Frases restantes: 0</div>

                <div class="phrase-box" id="phraseContainer">
                    <!-- Contenido dinámico -->
                </div>

                <div id="actionsContainer">
                    <!-- Botón siguiente o controles finales -->
                </div>
            </div>

            <!-- VISTA DE CONFIGURACIÓN Y CARGA -->
            <div id="configView" class="view">
                <div class="header-row">
                    <h1>Configuración</h1>
                    <button class="btn-icon" onclick="cambiarVista('mainView')" title="Volver">✕</button>
                </div>

                <div class="instruction-text">
                    Pega tus frases abajo separando el inglés y el español con una barra vertical <b>( | )</b>. Una frase por línea:
                    <br><br><i>I wake up early | Me despierto temprano<br>How are you? | ¿Cómo estás?</i>
                </div>

                <textarea id="inputFrases" placeholder="Escribe o pega tus frases aquí..."></textarea>

                <button class="btn-primary" onclick="guardarYCargarFrases()">💾 Guardar y Practicar</button>
                <button class="btn-danger" onclick="limpiarBancoTotal()" style="margin-top: 10px;">🗑️ Borrar todo el banco</button>
            </div>

        </div>
    </div>

    <script>
        let bancoFrases = [];
        let frasesDisponibles = [];
        let fraseActual = null;

        // Cargar datos guardados al iniciar
        window.onload = function() {
            const guardadas = localStorage.getItem('mi_banco_ingles');
            if (guardadas) {
                bancoFrases = JSON.parse(guardadas);
            }
            
            // Si no hay frases, mostrar configuración directamente
            if (bancoFrases.length === 0) {
                cambiarVista('configView');
            } else {
                reiniciarCicloPráctica();
                siguienteFrase();
            }
        };

        function cambiarVista(vistaId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(vistaId).classList.add('active');
            
            if (vistaId === 'configView') {
                // Rellenar el textarea con las frases actuales en formato texto
                const textoPlano = bancoFrases.map(f => `${f.en} | ${f.es}`).join('\n');
                document.getElementById('inputFrases').value = textoPlano;
            }
        }

        function guardarYCargarFrases() {
            const texto = document.getElementById('inputFrases').value;
            const lineas = texto.split('\n');
            let nuevasFrases = [];

            for (let linea of lineas) {
                if (linea.includes('|')) {
                    const partes = linea.split('|');
                    const en = partes[0].trim();
                    const es = partes[1].trim();
                    if (en && es) {
                        nuevasFrases.push({ en, es });
                    }
                }
            }

            if (nuevasFrases.length === 0) {
                alert("Por favor ingresa al menos una frase válida usando el formato: Inglés | Español");
                return;
            }

            bancoFrases = nuevasFrases;
            localStorage.setItem('mi_banco_ingles', JSON.stringify(bancoFrases));
            
            reiniciarCicloPráctica();
            cambiarVista('mainView');
            siguienteFrase();
            alert(`¡Se han cargado ${bancoFrases.length} frases exitosamente!`);
        }

        function reiniciarCicloPráctica() {
            // Copiar el banco completo a la lista de disponibles para barajar
            frasesDisponibles = [...bancoFrases];
            // Barajar aleatoriamente (Algoritmo Fisher-Yates)
            for (let i = frasesDisponibles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [frasesDisponibles[i], frasesDisponibles[j]] = [frasesDisponibles[j], frasesDisponibles[i]];
            }
        }

        function siguienteFrase() {
            const container = document.getElementById('phraseContainer');
            const actionsContainer = document.getElementById('actionsContainer');
            const counterBadge = document.getElementById('counterBadge');

            if (bancoFrases.length === 0) {
                counterBadge.textContent = "Banco vacío";
                container.innerHTML = `<div class="english-phrase" style="color: var(--muted-color); font-size: 1.1rem;">No hay frases cargadas. Toca el engranaje ⚙️ arriba para empezar.</div>`;
                actionsContainer.innerHTML = '';
                return;
            }

            // Si se acabaron las frases del ciclo actual
            if (frasesDisponibles.length === 0) {
                counterBadge.textContent = "¡Ciclo completado!";
                container.innerHTML = `
                    <div class="english-phrase" style="color: var(--success-color);">¡Excelente trabajo! 🚀</div>
                    <div class="spanish-translation">Has practicado todas las frases de tu banco.</div>
                `;
                actionsContainer.innerHTML = `
                    <button class="btn-primary" onclick="reiniciarYContinuar()">🔄 Seguir practicando</button>
                    <button class="btn-danger" onclick="cambiarVista('configView')">🗑️ Limpiar / Gestionar banco</button>
                `;
                return;
            }

            // Tomar la siguiente frase y removerla de las disponibles
            fraseActual = frasesDisponibles.pop();
            counterBadge.textContent = `Frases restantes en este ciclo: ${frasesDisponibles.length + 1}`;

            container.innerHTML = `
                <div class="english-wrapper">
                    <div class="english-phrase">"${fraseActual.en}"</div>
                    <button class="audio-btn" onclick="reproducirAudio()" title="Escuchar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                    </button>
                </div>
                <div class="spanish-translation">${fraseActual.es}</div>
            `;

            actionsContainer.innerHTML = `
                <button class="btn-primary" onclick="siguienteFrase()">Siguiente ➡️</button>
            `;
        }

        function reiniciarYContinuar() {
            reiniciarCicloPráctica();
            siguienteFrase();
        }

        function limpiarBancoTotal() {
            if (confirm("¿Estás seguro de vaciar todo tu banco de frases?")) {
                bancoFrases = [];
                localStorage.removeItem('mi_banco_ingles');
                document.getElementById('inputFrases').value = '';
                siguienteFrase();
                cambiarVista('configView');
            }
        }

        function reproducirAudio() {
            if (!fraseActual || !fraseActual.en) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(fraseActual.en);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
