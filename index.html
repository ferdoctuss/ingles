<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily English Pro</title>
    
    <!-- Icono optimizado para iOS y dispositivos móviles (Usando imagen PNG directa para evitar la "D" gris) -->
    <link rel="apple-touch-icon" href="https://i.imgur.com/8Q96z1l.png">
    <link rel="icon" type="image/png" href="https://i.imgur.com/8Q96z1l.png">

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --muted-color: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --danger-color: #dc2626;
            --success-color: #059669;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #090d16;
                --card-bg: #131d31;
                --text-color: #f8fafc;
                --accent-color: #38bdf8;
                --accent-hover: #0ea5e9;
                --muted-color: #94a3b8;
                --border-color: rgba(255, 255, 255, 0.08);
                --danger-color: #f87171;
                --success-color: #34d399;
            }
        }

        /* Bloqueo total de zoom y gestos por defecto */
        * {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 750px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-card {
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            max-height: 680px;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: -0.5px;
            color: var(--text-color);
            font-weight: 800;
        }

        .btn-icon {
            background: rgba(128, 128, 128, 0.1);
            border: none;
            color: var(--muted-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: rgba(128, 128, 128, 0.2);
            color: var(--text-color);
        }

        .view {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .view.active {
            display: flex;
        }

        /* Tarjeta Inmersiva Gigante para aprovechar todo el espacio */
        .immersive-card {
            background: rgba(128, 128, 128, 0.04);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 30px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin: 12px 0;
            position: relative;
        }

        .english-phrase {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-color);
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .audio-btn-large {
            background: var(--accent-color);
            border: none;
            color: #ffffff;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 24px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .audio-btn-large:active {
            transform: scale(0.92);
        }

        .audio-btn-large:hover {
            background: var(--accent-hover);
        }

        .spanish-translation {
            font-size: 1.05rem;
            color: var(--muted-color);
            font-style: italic;
            max-width: 90%;
            line-height: 1.4;
        }

        /* Panel de Botones de Navegación (Anterior / Siguiente) */
        .nav-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-nav {
            background-color: rgba(128, 128, 128, 0.1);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
        }

        .btn-nav:hover:not(:disabled) {
            background-color: rgba(128, 128, 128, 0.2);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            flex: 2;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: rgba(248, 113, 113, 0.12);
            color: var(--danger-color);
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-danger:hover {
            background-color: rgba(248, 113, 113, 0.2);
        }

        textarea {
            width: 100%;
            flex-grow: 1;
            background: rgba(128, 128, 128, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-color);
            padding: 14px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            margin-bottom: 12px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .instruction-text {
            font-size: 0.85rem;
            color: var(--muted-color);
            text-align: left;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .counter-badge {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            
            <!-- VISTA PRINCIPAL DE PRÁCTICA -->
            <div id="mainView" class="view active">
                <div class="header-row">
                    <h1>Daily English</h1>
                    <button class="btn-icon" onclick="cambiarVista('configView')" title="Configuración">⚙️</button>
                </div>

                <div class="counter-badge" id="counterBadge">Frase 0 de 0</div>

                <div class="immersive-card" id="phraseCard">
                    <!-- Contenido dinámico de la frase -->
                </div>

                <div class="nav-controls" id="navControls">
                    <!-- Botones de anterior y siguiente -->
                </div>
            </div>

            <!-- VISTA DE CONFIGURACIÓN Y CARGA -->
            <div id="configView" class="view">
                <div class="header-row">
                    <h1>Configuración</h1>
                    <button class="btn-icon" onclick="cambiarVista('mainView')" title="Volver">✕</button>
                </div>

                <div class="instruction-text">
                    Pega tus frases separando el inglés y el español con una barra vertical <b>( | )</b>. Una por línea:
                    <br><br><i>I wake up early | Me despierto temprano<br>How are you? | ¿Cómo estás?</i>
                </div>

                <textarea id="inputFrases" placeholder="Escribe o pega tus frases aquí..."></textarea>

                <button class="btn-primary" onclick="guardarYCargarFrases()" style="margin-bottom: 8px;">💾 Guardar y Empezar</button>
                <button class="btn-danger" onclick="limpiarBancoTotal()">🗑️ Borrar todo el banco</button>
            </div>

        </div>
    </div>

    <script>
        let bancoFrases = [];
        let indiceActual = 0;

        let ultimoToke = 0;
        document.addEventListener('touchend', function (event) {
            const ahora = new Date().getTime();
            if (ahora - ultimoToke <= 300) {
                event.preventDefault();
            }
            ultimoToke = ahora;
        }, { passive: false });

        window.onload = function() {
            const guardadas = localStorage.getItem('mi_banco_ingles');
            if (guardadas) {
                bancoFrases = JSON.parse(guardadas);
            }
            
            if (bancoFrases.length === 0) {
                cambiarVista('configView');
            } else {
                indiceActual = 0;
                mostrarFraseActual();
            }
        };

        function cambiarVista(vistaId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(vistaId).classList.add('active');
            
            if (vistaId === 'configView') {
                const textoPlano = bancoFrases.map(f => `${f.en} | ${f.es}`).join('\n');
                document.getElementById('inputFrases').value = textoPlano;
            }
        }

        function guardarYCargarFrases() {
            const texto = document.getElementById('inputFrases').value;
            const lineas = texto.split('\n');
            let nuevasFrases = [];

            for (let linea of lineas) {
                if (linea.includes('|')) {
                    const partes = linea.split('|');
                    const en = partes[0].trim();
                    const es = partes[1].trim();
                    if (en && es) {
                        nuevasFrases.push({ en, es });
                    }
                }
            }

            if (nuevasFrases.length === 0) {
                alert("Por favor ingresa al menos una frase válida usando el formato: Inglés | Español");
                return;
            }

            bancoFrases = nuevasFrases;
            localStorage.setItem('mi_banco_ingles', JSON.stringify(bancoFrases));
            
            indiceActual = 0;
            cambiarVista('mainView');
            mostrarFraseActual();
            alert(`¡Se han cargado ${bancoFrases.length} frases con éxito!`);
        }

        function mostrarFraseActual() {
            const card = document.getElementById('phraseCard');
            const navControls = document.getElementById('navControls');
            const counterBadge = document.getElementById('counterBadge');

            if (bancoFrases.length === 0) {
                counterBadge.textContent = "Banco vacío";
                card.innerHTML = `<div class="english-phrase" style="font-size: 1.1rem; color: var(--muted-color);">No hay frases cargadas.<br>Toca la ⚙️ arriba para empezar.</div>`;
                navControls.innerHTML = `<button class="btn-primary" onclick="cambiarVista('configView')">⚙️ Cargar Frases</button>`;
                return;
            }

            // Si se repasaron todas las frases (llegó al final)
            if (indiceActual >= bancoFrases.length) {
                counterBadge.textContent = "¡Ciclo completado!";
                card.innerHTML = `
                    <div class="english-phrase" style="color: var(--success-color); font-size: 1.3rem;">¡Excelente trabajo! 🚀</div>
                    <div class="spanish-translation" style="font-style: normal; margin-bottom: 10px;">Has repasado ordenadamente todas las frases de tu banco.</div>
                `;
                navControls.innerHTML = `
                    <button class="btn-nav" onclick="reiniciarCiclo()">🔄 Repetir</button>
                    <button class="btn-primary" onclick="cambiarVista('configView')">🗑️ Gestionar</button>
                `;
                return;
            }

            counterBadge.textContent = `Frase ${indiceActual + 1} de ${bancoFrases.length}`;
            const frase = bancoFrases[indiceActual];
            const textoSeguro = frase.en.replace(/'/g, "\\'");

            card.innerHTML = `
                <div class="english-phrase">"${frase.en}"</div>
                <button class="audio-btn-large" onclick="reproducirAudio('${textoSeguro}')" title="Escuchar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                </button>
                <div class="spanish-translation">${frase.es}</div>
            `;

            navControls.innerHTML = `
                <button class="btn-nav" onclick="fraseAnterior()" ${indiceActual === 0 ? 'disabled' : ''}>⬅️ Anterior</button>
                <button class="btn-primary" onclick="fraseSiguiente()">Siguiente ➡️</button>
            `;
        }

        function fraseSiguiente() {
            if (indiceActual < bancoFrases.length) {
                indiceActual++;
                mostrarFraseActual();
            }
        }

        function fraseAnterior() {
            if (indiceActual > 0) {
                indiceActual--;
                mostrarFraseActual();
            }
        }

        function reiniciarCiclo() {
            indiceActual = 0;
            mostrarFraseActual();
        }

        function limpiarBancoTotal() {
            if (confirm("¿Estás seguro de vaciar todo tu banco de frases?")) {
                bancoFrases = [];
                localStorage.removeItem('mi_banco_ingles');
                document.getElementById('inputFrases').value = '';
                indiceActual = 0;
                mostrarFraseActual();
                cambiarVista('configView');
            }
        }

        function reproducirAudio(texto) {
            if (!texto) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
